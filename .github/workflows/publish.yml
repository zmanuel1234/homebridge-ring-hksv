name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag and the pre-release box match package.json
        run: .github/scripts/check-release-tag.sh "${{ github.event.release.tag_name }}" "${{ github.event.release.prerelease }}"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Use an npm with trusted publishing (11.5.1 or later; pinned to major version 11)
        run: npm install -g npm@11
      # Trusted publishing: npm checks this workflow's GitHub OIDC identity, so no token is stored anywhere.
      - name: Publish (pre-releases go to the beta tag)
        run: npm publish --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}
